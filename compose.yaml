services:
  xboard:
    image: xboard-airport-aggregator:20260806-nodeview
    pull_policy: never
    restart: unless-stopped
    ports:
      - "7001:7001"
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - redis-data:/data
    environment:
      - RESOURCE_PROFILE=balanced
      - ENABLE_HORIZON=true
      - docker=true
    networks:
      - default
      - sublink-network

volumes:
  redis-data:

networks:
  sublink-network:
    external: true
    name: sublinkpro_default
